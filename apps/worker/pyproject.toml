[project]
name = "wrapd-worker"
version = "0.1.0"
description = "Worker que ingesta plays de Spotify en Postgres"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Antonio Jesús" }]
license = { text = "MIT" }
dependencies = [
    "spotipy>=2.24",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prefect>=2.20,<3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrapd_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/wrapd_worker --cov-report=term-missing"
